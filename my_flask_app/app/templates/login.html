<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
    <title>Login</title>
    <style>
        body {
            background-color: #f2f2f2; /* Фон страницы */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .login-container {
            background-color: white; /* Фон формы */
            padding: 40px;
            border-radius: 10px; /* Закругленные углы */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Тень для формы */
            width: 300px;
        }
        h1 {
            text-align: center; /* Центровка заголовка */
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        input[type="text"], input[type="password"] {
            width: 100%; /* Ширина полей ввода */
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px; /* Полукруглые углы */
            box-sizing: border-box; /* Включить padding и border в width */
        }
        .btn-submit {
            width: 100%; /* Ширина кнопки */
            background-color: #4CAF50; /* Цвет кнопки */
            color: white;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 20px; /* Полукруглая кнопка */
            cursor: pointer;
            font-size: 16px;
        }
        .btn-submit:hover {
            background-color: #45a049; /* Цвет кнопки при наведении */
        }
        .form-errors {
            color: red;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Login</h1>
        <form method="POST">
            {{ form.hidden_tag() }}
            <div class="form-group">
                {{ form.username.label }}
                {{ form.username(class="form-control") }}
                {% for error in form.username.errors %}
                    <div class="form-errors">{{ error }}</div>
                {% endfor %}
            </div>
            <div class="form-group">
                {{ form.password.label }}
                {{ form.password(class="form-control") }}
                {% for error in form.password.errors %}
                    <div class="form-errors">{{ error }}</div>
                {% endfor %}
            </div>
            <button type="submit" class="btn-submit">{{ form.submit.label }}</button>
        </form>
    </div>
</body>
</html>
